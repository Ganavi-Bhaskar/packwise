services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/var/food_packaging.db
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - packwise-data:/app/var
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  packwise-data:
